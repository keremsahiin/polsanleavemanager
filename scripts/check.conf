# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Generated by bootstrap (2026-10-19). Stack: Python 3.14 + uv, FastAPI, vanilla JS (ADR 0001).
# One step per line:  <name>: <command>   — runs in order, fails fast.
# [fast] in the NAME = also runs in ./scripts/check --fast (docs/testing.md, Two speeds).
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene) — what each tool could leave behind:
#   uv run       run-once; starts no daemon or server. --locked: fail if uv.lock is stale (no silent resolve).
#   ruff         run-once CLI; never `ruff server` (LSP) here.
#   mypy         run-once CLI; never `dmypy` (daemon) here.
#   lint-imports run-once CLI; leaves only an on-disk cache (.import_linter_cache, gitignored).
#   node --check run-once syntax check per file; no server, no watcher.
#   pytest       single process (no xdist). e2e: headless Chromium, one worker; the app under test
#                (uvicorn) is owned by the session fixture in tests/e2e/conftest.py and is killed in
#                `finally`, including on failure and timeout.

# resource hygiene: run-once CLIs, no daemon
lint [fast]: uv run --locked ruff check .
format [fast]: uv run --locked ruff format --check .
# resource hygiene: plain mypy, no dmypy daemon
types [fast]: uv run --locked mypy
boundaries [fast]: uv run --locked lint-imports
# Loop (not `find -exec … \;`, whose exit code ignores failures) so one bad file turns check red.
js-syntax [fast]: sh -c 'rc=0; for f in $(find app -name "*.js"); do node --check "$f" || rc=1; done; exit $rc'

# Unit + integration (everything not marked e2e — a selector, never a list: docs/testing.md).
# Collects coverage data for app/; the domain gate is reported by the next step.
# resource hygiene: single pytest process (no xdist); subprocess tests use timeouts
test [fast]: uv run --locked pytest -m "not e2e" --cov --cov-report=
# Domain coverage gate (docs/testing.md): >= 90 % line + branch over app/modules/*/internal/domain,
# from the data the test step just collected. With no domain file there is nothing to gate (spec
# 0001 R-12) — coverage itself would fail with "No data to report", so the condition is explicit.
domain-coverage [fast]: sh -c 'if find app/modules -path "*/internal/domain/*.py" ! -name "__init__.py" | grep -q .; then uv run --locked coverage report --include="app/modules/*/internal/domain/*" --fail-under=90; else echo "domain-coverage: no domain code yet, the gate is empty"; fi'
# Full profile only: browser e2e (everything under tests/e2e is marked e2e by its conftest).
# resource hygiene: headless Chromium, one worker; the app under test (python -m app) and the
# browser are owned by tests/e2e/conftest.py fixtures and stopped in `finally`
e2e: uv run --locked pytest -m e2e
