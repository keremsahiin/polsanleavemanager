# Alembic — the only way the schema changes (docs/conventions.md, Data rules).
# The target database comes from PLM_DATABASE_PATH (migrations/env.py); there is no URL here.
# Upgrade: uv run --env-file .env alembic upgrade head   (docs/development.md)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
